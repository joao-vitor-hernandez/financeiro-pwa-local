name: Backend CI (FastAPI & PostgreSQL)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Backend Lint, Test & Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password_test_123
          POSTGRES_DB: financeiro_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Linter (Ruff)
        run: |
          ruff check backend

      - name: Run Automated Test Suite (Pytest)
        env:
          ENVIRONMENT: test
          DEBUG: "False"
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password_test_123
          POSTGRES_DB: financeiro_test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          JWT_SECRET_KEY: test_secret_key_ci_environment_1234567890abcdef
          PRIMARY_USER_EMAIL: jvhernandez.dev@gmail.com
          PLUGGY_CLIENT_ID: ""
          PLUGGY_CLIENT_SECRET: ""
        run: |
          cd backend
          pytest tests --verbose --cov=app --cov-report=term-missing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: clarifin-backend:ci-test
