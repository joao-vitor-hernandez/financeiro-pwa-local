name: Frontend CI/CD (Angular PWA & Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-test:
    name: Frontend Lint, Test & PWA Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Unit Tests (Vitest)
        run: |
          cd frontend
          npx ng test --watch=false

      - name: Build Production PWA Bundle
        run: |
          cd frontend
          npm run build --configuration production

      - name: Verify Build Artifacts & SPA Routing
        run: |
          test -f frontend/dist/frontend/browser/index.html || { echo "index.html ausente!"; exit 1; }
          test -f frontend/dist/frontend/browser/_redirects || { echo "_redirects ausente!"; exit 1; }
          test -f frontend/dist/frontend/browser/manifest.webmanifest || { echo "manifest ausente!"; exit 1; }
          echo "Bundle de produção verificado com sucesso para Cloudflare Pages."

      - name: Deploy to Cloudflare Pages (Action Direct)
        uses: cloudflare/pages-action@v1
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: financeiro-pwa-local
          directory: frontend/dist/frontend/browser
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Status Summary
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Build de produção aprovado nos testes. Publicação automática gerenciada pelo Cloudflare Pages Git Integration conectado ao repositório."
